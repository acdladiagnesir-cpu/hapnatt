# HapNatt - construction automatique de l'exécutable Windows.
# Se lance à chaque version publiée (étiquette v1.0.0, v1.1.0...) ou à la main
# depuis l'onglet « Actions ». L'archive .zip est jointe à la version.
name: Executable Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Construction
        run: python construire_exe.py
      - name: Archive téléchargeable (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: HapNatt-windows
          path: dist/*.zip
      - name: Jointure à la version publiée
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
